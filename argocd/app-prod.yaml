apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-prod-metadata
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nakyungwon/my-devops-config.git
    # dev 와 같은 main 을 봅니다. prod 를 막는 건 브랜치·태그가 아니라 아래의 수동 sync 입니다.
    # main 에 올라온 values-prod.yaml 변경은 SYNC 전까지 OutOfSync 로 대기합니다.
    targetRevision: main
    path: chart
    helm:
      releaseName: web
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # automated 없음 — 있으면 dev 와 똑같아져서 나눈 의미가 없습니다.
    # 배포는 ArgoCD UI 의 SYNC 버튼이나 아래 명령으로:
    #   kubectl patch app web-prod-metadata -n argocd --type merge \
    #     -p '{"operation":{"sync":{"syncOptions":["CreateNamespace=true"]}}}'
    # syncOptions 를 operation 에도 넣어야 합니다. 아래 syncPolicy.syncOptions 는
    # 자동 sync 에만 적용되고 수동 operation 에는 안 딸려옵니다 (ArgoCD 2.9).
    syncOptions:
      - CreateNamespace=true
